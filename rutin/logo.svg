<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a5c"/>
      <stop offset="1" stop-color="#051421"/>
    </linearGradient>
    <linearGradient id="alif" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00b8d4"/>
      <stop offset="1" stop-color="#8eeefa"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#e09a2b"/>
    </linearGradient>
    <mask id="cut">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="256" cy="268" r="112" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <g transform="translate(0.00 0.00) scale(1)">
    <!-- crescent opening upwards -->
    <circle cx="256" cy="300" r="124" fill="url(#moon)" mask="url(#cut)"/>
    <!-- upright alif rising from the crescent, slightly tapered like a pen stroke -->
    <path d="M238 132 L276 108 C275 200 270 300 266 372 C265 390 247 390 246 372 C243 300 240 210 238 132 Z" fill="url(#alif)"/>
    <!-- small eight-pointed star above -->
    <path d="M256 46 L262 62 L278 56 L272 72 L288 78 L272 84 L278 100 L262 94 L256 110 L250 94 L234 100 L240 84 L224 78 L240 72 L234 56 L250 62 Z" fill="#ffd27a" transform="translate(258 70) scale(0.55) translate(-256 -78)"/>
  </g>
</svg>