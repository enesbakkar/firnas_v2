name: Build Istiqamah APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Istiqamah APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rutin/package-lock.json

      - name: Install Dependencies
        run: |
          cd rutin
          npm install

      - name: Prepare Web Assets
        run: |
          cd rutin
          mkdir -p www
          cp index.html style.css app.js daily.js logo.svg manifest.json icon-192.png icon-512.png www/
          cp -r banks www/

      - name: Initialize Capacitor & Add Android
        run: |
          cd rutin
          npx cap add android

      - name: Register istikamet:// deep link (Google sign-in returns here)
        run: |
          cd rutin
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          f = ('<intent-filter><action android:name="android.intent.action.VIEW" />'
               '<category android:name="android.intent.category.DEFAULT" />'
               '<category android:name="android.intent.category.BROWSABLE" />'
               '<data android:scheme="istikamet" android:host="oauth" /></intent-filter></activity>')
          assert '</activity>' in s
          open(p, 'w').write(s.replace('</activity>', f, 1))
          PY
          grep -n istikamet android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: |
          cd rutin
          npx cap sync android

      - name: Generate App Assets (Icons & Splash)
        run: |
          cd rutin
          npx @capacitor/assets generate --android

      - name: Build APK with Gradle
        run: |
          cd rutin/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Istiqamah-APK
          path: rutin/android/app/build/outputs/apk/debug/app-debug.apk
